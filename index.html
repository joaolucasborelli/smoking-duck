<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fábrica de Posts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: app de uma tela; topo com as contas e 2 abas (Posts e capas, Chat); o mesmo campo aberto, no estilo do Claude, embaixo da tela do post e do chat */
:root{
  --bg:#EEEFEC; --panel:#FFFFFF; --ink:#1B1E22; --muted:#5C6168; --line:#DADCD6; --hover:#F4F5F2; --shade:rgba(20,22,25,.45);
  --accent:#2347D6;
  --wait:#FFE7A3; --wait-ink:#7A5600; --ok:#D3EEDB; --ok-ink:#1C6A41; --draft:#E4E6EA; --draft-ink:#474C55; --sched:#DCE5FB; --sched-ink:#1F3A9E; --rej:#F9D6D1; --rej-ink:#A3261C;
  --a1:#111111; --a1-hl:#FFD21F; --a1-tx:#F5F5F0; --a2:#F6EDE4; --a2-ink:#4A2C2A; --a2-hl:#C9707D;
  --f-d:"Bricolage Grotesque","Arial Black",Arial,sans-serif;
  --f-b:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --panel:#1C1F23; --ink:#ECEDEA; --muted:#A4A9AF; --line:#30343A; --hover:#24282D; --shade:rgba(0,0,0,.6); --accent:#7F9CFF;
  --wait:#3A2F10; --wait-ink:#F2CD6A; --ok:#173826; --ok-ink:#8EDDB0; --draft:#2A2E33; --draft-ink:#C3C8CE; --sched:#22304F; --sched-ink:#AFC3FF; --rej:#3E1A17; --rej-ink:#F4958C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --panel:#1C1F23; --ink:#ECEDEA; --muted:#A4A9AF; --line:#30343A; --hover:#24282D; --shade:rgba(0,0,0,.6); --accent:#7F9CFF;
  --wait:#3A2F10; --wait-ink:#F2CD6A; --ok:#173826; --ok-ink:#8EDDB0; --draft:#2A2E33; --draft-ink:#C3C8CE; --sched:#22304F; --sched-ink:#AFC3FF; --rej:#3E1A17; --rej-ink:#F4958C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.15}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-d);font-weight:800}
.accts,.tabs{display:flex;gap:6px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:.9rem}
.acct .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-size:.78rem}
.acct[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.av1{background:var(--a1);color:var(--a1-hl)} .av2{background:var(--a2);color:var(--a2-ink);border:1px solid var(--a2-hl)}
.tabs{margin-left:auto}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-weight:700}
.tab[aria-current="page"]{background:var(--ink);color:var(--panel)}
.proto{font-size:.72rem;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:2px 7px}
.view{min-height:0;overflow:auto}
.pad{padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:1200px;margin:0 auto}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.f{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:.84rem}
.f[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--ink)}
.card .meta{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.when{font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums}
.when small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.st{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.fmt{position:absolute;left:8px;bottom:8px;right:8px;z-index:3;background:rgba(17,17,17,.88);color:#FFD21F;font:700 .66rem/1.25 Inter,sans-serif;padding:5px 7px;border-radius:6px;display:flex;flex-direction:column;gap:2px}.fmt i{font-style:normal;color:#ddd;font-weight:600}.fmt.carregando{color:#ddd;animation:pisca 1.2s infinite}
.da{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.da-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.da-h .small{flex:1;min-width:200px}
.da-lista{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.da-it{flex:none;width:190px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.78rem;background:var(--bg,#fff)}
.da-ex{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;margin:6px 0 2px;background:var(--line)}
.da-top{display:flex;gap:6px;align-items:center}.da-top .n{font-weight:800;min-width:18px}.da-top select{flex:1;min-width:0;font:600 .74rem Inter,sans-serif;padding:4px;border-radius:6px;border:1px solid var(--line);background:transparent;color:inherit}
.da-it .fonte{display:inline-block;margin:6px 0 4px;font-weight:700;font-size:.72rem}.da-it .fonte.real{color:#b45309}.da-it p{margin:0;line-height:1.35;color:var(--muted,#666)}
.selos{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.st-mont{background:#FFD21F;color:#111;display:inline-flex;align-items:center;gap:5px}.st-mont i{width:6px;height:6px;border-radius:50%;background:#111;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.2}}
.st-custo{background:rgba(255,210,31,.12);color:#e9c84a;border:1px solid rgba(255,210,31,.35)}.st-custo.semcusto{opacity:.55}.custo-det{margin:8px 0 0;color:var(--muted,#9a9ea6)}
.avaliar{font:600 .82rem Inter,sans-serif;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-right:6px}.avaliar:hover{border-color:var(--accent);color:var(--accent)}
.st-wait{background:var(--wait);color:var(--wait-ink)} .st-ok{background:var(--ok);color:var(--ok-ink)} .st-draft{background:var(--draft);color:var(--draft-ink)} .st-sched{background:var(--sched);color:var(--sched-ink)} .st-rej{background:var(--rej);color:var(--rej-ink)} .st-prop{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cover{aspect-ratio:4/5;max-width:100%;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;font-family:var(--f-d);font-weight:800;line-height:1.1;font-size:.95rem;position:relative}
.c1{background:linear-gradient(180deg,#3A3A3A 0%,#111111 70%);color:var(--a1-tx)}
.c1 mark{background:var(--a1-hl);color:#111111;padding:0 .12em}
.c2{background:var(--a2);color:var(--a2-ink)}
.c2 mark{background:transparent;color:var(--a2-hl)}
.c2 .face{position:absolute;top:10px;right:10px;width:40%;aspect-ratio:1;border-radius:50%;background:linear-gradient(160deg,#C8C2BB,#8F8780);border:3px solid var(--a2-hl)}
.txt{justify-content:center;font-family:var(--f-b);font-weight:600}
/* esboço da proposta: sem imagem de IA, só onde cada coisa vai ficar */
.esb{background:repeating-linear-gradient(135deg,var(--panel) 0 9px,var(--hover) 9px 18px);color:var(--ink);border:2px dashed var(--muted);justify-content:flex-start;padding:0;overflow:hidden}
.esb .pess{position:absolute;bottom:0;width:46%;color:var(--muted)}
.esb .pess.dir{right:4%} .esb .pess.esq{left:4%} .esb .pess.cen{left:27%}
.esb .pess svg{width:100%;height:auto;display:block;fill:currentColor;opacity:.55}
.esb .pess i{position:absolute;top:-1.4em;left:0;right:0;text-align:center;font-style:normal;font-family:var(--f-b);font-size:.62rem;font-weight:700;color:var(--muted)}
.esb .tb{position:absolute;border:1.5px dashed var(--accent);background:var(--panel);padding:4px 6px;border-radius:3px;font-family:var(--f-d);font-weight:800;line-height:1.1;font-size:.82em}
.esb .tb mark{background:var(--wait);color:var(--wait-ink);padding:0 .1em}
.esb .tb.topo{top:9%;left:6%;width:54%} .esb .tb.base{bottom:7%;left:6%;right:6%} .esb .tb.meio{top:30%;left:8%;right:8%;font-family:var(--f-b);font-weight:600}
.esb .tb.esq{top:12%;left:6%;width:48%}
.esb .etq{position:absolute;top:8px;right:8px;font-family:var(--f-b);font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--panel);padding:1px 6px;border-radius:3px}
.cover .n{position:absolute;top:8px;left:8px;font-family:var(--f-b);font-size:.66rem;font-weight:700;background:rgba(0,0,0,.5);color:#FFFFFF;padding:1px 6px;border-radius:3px}
/* tela do post */
.postview{display:block;height:100%;overflow:auto}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;max-height:62vh;overflow:auto}
.capopt{display:flex;flex-direction:column;gap:6px;background:none;border:2px solid var(--line,#2a2d33);border-radius:12px;padding:6px;cursor:pointer;color:inherit;font:600 12px Inter,sans-serif}
.capopt img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block;background:#111}
.capopt.on{border-color:#FFD21F}.capopt:hover{border-color:#FFD21F}
.listaesc{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,44%);gap:18px;padding:18px 18px 28px;align-items:start}
.lcol{min-width:0}
.escgeral{position:sticky;top:12px;height:calc(100vh - 96px);min-height:520px;display:flex;flex-direction:column}.escgeral>.escr{flex:1}
@media (max-width:1000px){.listaesc{grid-template-columns:1fr}.escgeral{position:static;height:560px}}
.pbaixo{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:14px;padding:12px 16px 14px;height:min(780px,calc(100vh - 70px));min-height:560px}
.escbox{min-height:0;display:flex;flex-direction:column}.escbox>.escr{flex:1}
.pchat{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line,#2a2d33);border-radius:14px;overflow:hidden;background:var(--panel,transparent)}
.pchat-h{display:flex;align-items:baseline;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line,#2a2d33)}
.pchat .pbody{flex:1;min-height:0}
@media (max-width:900px){.pbaixo{grid-template-columns:1fr;overflow:auto}.escbox{min-height:520px}.pchat{min-height:360px}}
.phead{background:var(--panel);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0}
.prow .sp{flex:1}
.btn{border:1.5px solid var(--ink);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:700;font-size:.88rem}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.strip .sb{flex:0 0 190px;border:0;padding:0;background:transparent;border-radius:6px;overflow:hidden;text-align:left}
.strip .sb:hover{outline:2px solid var(--accent)}
.strip .cover{font-size:.86rem;padding:12px;border-radius:6px}
.cover.img{padding:0;overflow:hidden;background:#111}
.cover.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover.img .n{z-index:1}
.acct.lixo{padding:4px 10px;color:#c0392b}.acct.lixo:hover{border-color:#c0392b}
.acct.mais{padding:4px 12px;font-size:1.1rem;font-weight:800}.amb-st{margin-left:4px;font-size:.72rem;font-weight:700;color:var(--muted,#888);border:1px solid var(--line);border-radius:99px;padding:1px 6px}
.estudo{max-width:980px;margin:0 auto;padding:22px 16px 60px;display:grid;gap:14px}
.est-cab{display:flex;gap:12px;align-items:center}.est-cab h2{margin:0}.est-cab .av{width:44px;height:44px;font-size:1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.est-agentes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.est-ag{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem}
.est-ag i{width:10px;height:10px;border-radius:50%;background:#e0a800;animation:pisca 1.2s infinite}.est-ag.pronto i{background:#16a34a;animation:none}.est-ag.erro i{background:#dc2626;animation:none}
@keyframes pisca{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.est-ag i{animation:none}}
.est-log{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.88rem;display:grid;gap:4px;max-height:320px;overflow:auto}.est-log p{margin:0}
.est-texto{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;resize:vertical}
.estudo .doc{background:#f6f5f0;color:#16181c;border-radius:16px;padding:22px}
.estudo .doc h2{margin:0;font-size:1.8rem}.estudo .dsub{color:#5d636b;font-size:.9rem;margin:4px 0 0}
.estudo .resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.estudo .rbox,.estudo .item{background:#fff;border:1px solid #e1dfd8;border-radius:10px;padding:12px}
.estudo .rbox small,.estudo .lab{display:block;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#7a7f87;margin-bottom:4px}
.estudo .rbox p,.estudo .item p,.estudo .item li{font-size:.9rem;line-height:1.45;margin:0}
.estudo .secao{margin-top:18px}.estudo .secao h4{margin:0 0 8px;font-size:1.05rem;text-transform:uppercase}
.estudo .item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:10px}.estudo .item ul{margin:0;padding-left:18px}
.estudo .rod{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed #e1dfd8;padding-top:8px;font-size:.8rem;color:#5d636b}
.estudo .cert{font-weight:700;font-size:.7rem;text-transform:uppercase;padding:3px 7px;border-radius:5px}.c-alta{background:#dcfce7;color:#166534}.c-media{background:#fef3c7;color:#92400e}.c-baixa{background:#fee2e2;color:#991b1b}
.estudo .final{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#16181c;color:#f6f5f0;border-radius:12px;padding:14px 16px}
.avisos{border:2px solid var(--accent,#FFD21F);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.aviso{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.aviso p{margin:2px 0;font-size:.9rem}.aviso small{opacity:.75}.av-bt{display:flex;gap:6px}
@media (max-width:760px){.est-agentes{grid-template-columns:1fr 1fr}.estudo .resumo{grid-template-columns:1fr 1fr}.estudo .item,.aviso{grid-template-columns:1fr}}
.retoque{margin:12px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;display:grid;gap:10px}
.rt-cab{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rt-linha{display:grid;grid-template-columns:auto 90px minmax(0,1fr) auto;gap:8px;align-items:center}
.rt-linha textarea{width:100%;resize:vertical;min-height:40px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
.rt-linha select{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
.rt-hist{list-style:none;display:grid;gap:6px;font-size:.88rem}.rt-hist .btn.mini{padding:3px 8px;font-size:.8rem}
.rt-erro{display:block;opacity:.75;margin-top:2px}
@media (max-width:640px){.rt-linha{grid-template-columns:1fr 1fr}.rt-linha textarea,.rt-linha .btn{grid-column:1/-1}}
.montaviso{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:#fff7d6;color:#5a4500;font-size:.9rem}
.montaviso.erro{background:#fde2e2;color:#7a1414}
.strip .cover.c2 .face{width:36%}
/* visualizador em tela cheia, como o Instagram */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(8,9,11,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vframe{position:relative;height:min(78vh,calc((100vw - 120px) * 1.25));aspect-ratio:4/5;max-width:100%}
.vframe .cover{height:100%;width:100%;font-size:clamp(1rem,2.6vh,1.6rem);padding:6%;border-radius:8px}
.vframe .cover .n{display:none}
.varrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111111;font-size:1.3rem;font-weight:800;display:grid;place-items:center}
.varrow.l{left:-58px} .varrow.r{right:-58px}
.varrow:disabled{opacity:.25;cursor:default}
.vdots{display:flex;gap:6px}
.vdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.vdots i.on{background:#FFFFFF}
.vtop{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;color:#FFFFFF;font-size:.9rem}
.vtop button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#FFFFFF;border-radius:6px;padding:5px 10px;font-weight:700}
@media (max-width:700px){.varrow.l{left:6px}.varrow.r{right:6px}.vframe{height:auto;width:100%}}
/* legenda como no Instagram */
.ig{padding:12px 0 4px;font-size:.95rem;line-height:1.45;max-width:640px}
.ig b{font-weight:700;margin-right:6px}
.ig .hs{color:var(--accent)}
.ig .more{border:0;background:transparent;color:var(--muted);padding:0;font-weight:600}
.ig .full{white-space:pre-wrap}
.why{max-width:760px;font-size:.88rem}
.why summary{cursor:pointer;color:var(--accent);font-weight:700}
.why dl{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:4px 10px;margin:8px 0 0}
.why dt{color:var(--muted)} .why dd{margin:0}
.pbody{overflow:auto}
.pbody .pad{max-width:760px}
.fieldlab{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.caption{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;margin-bottom:14px}
.hashes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.hashes span{background:var(--sched);color:var(--sched-ink);border-radius:999px;padding:2px 10px;font-size:.84rem}
.log{display:flex;flex-direction:column;gap:8px}

const JA_PLANEJOU=new Set();let planejandoN=0;
function planejarFila(){
  const fila=POSTS.filter(p=>p.s==="prop"&&!p.plano&&!p.planejando&&!JA_PLANEJOU.has(p.id));
  while(planejandoN<2&&fila.length){const p=fila.shift();JA_PLANEJOU.add(p.id);planejandoN++;
    planejarVisual(p).finally(()=>{planejandoN--;planejarFila()});}
}
async function planejarVisual(p,extra={}){
  if(p.planejando)return;p.planejando=true;p.planoErro=null;render();
  falaDA("trabalhando",extra.forcar?`Refazendo o plano com o formato que você escolheu para o slide ${Object.keys(extra.forcar).join(", ")}.`:"Lendo o post aprovado e escolhendo o formato de cada slide: notícia, cupom, foto, checklist…");
  try{await tetoOk();const {data,error}=await sb.functions.invoke("roteiro",{body:{acao:"plano_visual",variacao_id:p.id,...extra}});
    if(error)throw error;if(!data||!data.ok)throw new Error((data&&data.erro)||"erro");
    p.plano=data.plano;const pl=data.plano.post,reais=[pl.capa,...pl.slides].filter(s=>s.foto_fonte==="real").length;
    falaDA("pronto",`Plano pronto: ${pl.slides.length+1} slides, receita ${String(pl.receita||"").slice(0,40)}${reais?`, ${reais} com foto real`:""}. A montagem vai seguir este plano.`);
  }catch(e){p.planoErro=e.message||String(e);falaDA("erro","Não consegui planejar: "+p.planoErro)}
  p.planejando=false;render();
}

function ocupado(a,dt,ignore){return POSTS.find(p=>p.a===a&&p.id!==ignore&&(p.s==="sched"||p.s==="ok")&&p.t&&Math.abs(p.t-dt)<60*60*1000)}
// próximo horário livre da agenda; "depois" faz a busca começar depois de um horário (usado ao empurrar um post)
function proximoLivre(a,ignore,depois){const ini=depois&&depois>HOJE?depois:HOJE;for(let dia=0;dia<30;dia++){for(const h of AGENDA[a]){const [hh,mm]=h.split(":");const t=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+dia,+hh,+mm);if(t-HOJE<15*60*1000)continue;if(depois&&t<=depois)continue;if(!ocupado(a,t,ignore))return t}}return null}

function ESB(a,i){const o=[["dir","topo"],["esq","base"],["cen","topo"]][i%3];return {pessoa:o[0],texto:o[1],quem:a==="a2"?"Lívia":"pessoa da história"}}
const ETAPAS=[
 ["Planejadores","um para cada combinação de tipo e persona: leem os vencedores, os ganchos e as suas escolhas"],
 ["Escritores","escrevem as variações completas, cada uma remodelando um post vencedor real"],
 ["Conferente e plateia","apontam erros e dão nota a todas; elas aparecem da mais forte para a mais fraca"]

const TIPOS=[["historia","História"],["momento","Momento"],["curiosidade","Curiosidade"]];
const PERSONAS=[["jovem","Jovem"],["homem","Homem"],["mulher","Mulher"]];
const ROT=Object.fromEntries([...TIPOS,...PERSONAS]);
// roda no máximo "lim" chamadas ao mesmo tempo
async function emFila(itens,lim,fn){const res=new Array(itens.length);let i=0;
  await Promise.all(Array.from({length:Math.min(lim,itens.length)},async()=>{while(i<itens.length){const k=i++;try{res[k]={ok:true,v:await fn(itens[k],k)}}catch(e){res[k]={ok:false,e}}}}));return res}

// TETO DE GASTO (10/11): passou do teto do dia, a tela não chama a IA (o robô também para sozinho)
async function tetoOk(){try{const {data}=await sb.from("gasto_hoje").select("usd,teto").single();if(data&&+data.usd>=+data.teto)throw new Error(`Teto do dia atingido: a fábrica já gastou US$ ${(+data.usd).toFixed(2)} hoje (teto US$ ${(+data.teto).toFixed(2)}). Volta a funcionar à meia-noite.`)}catch(e){if(/Teto do dia/.test(e.message))throw e}}
const GASTA=["pesquisar","planejar","planejar_semana","escrever","avaliar","conversar"];
async function chamar(body){
  if(GASTA.includes(body.acao))await tetoOk();
  const {data,error}=await sb.functions.invoke("fabrica",{body});
  if(error){let m=error.message;try{const j=await error.context.json();m=j.erro||m}catch(_){}throw new Error(m)}
  if(data&&data.erro)throw new Error(data.erro);
  return data;
}
async function startPipe(o){
  const a=acc;const lote=new Date().toISOString();const por=o.qtd/9;
  const P=PIPE[a]={etapa:0,done:false,n:0,qtd:o.qtd,info:[[],[],[]]};
  const rr=rrTudo;
  const persA=(a!=="a1"&&ACC[a].pers)||PERSONAS;const amb=ACC[a].amb||1;
  let combos=TIPOS.flatMap(([t])=>persA.map(([p])=>({tipo:t,persona_id:p})));
  // menos de 9: pega combinações que variam tipo e persona ao mesmo tempo (1 proposta em cada)
  if(o.qtd<9){const n=persA.length,ordem=[];for(let k=0;k<combos.length;k++){const t=k%3,pi=(k+Math.floor(k/3))%n;ordem.push(combos[t*n+pi])}combos=ordem.slice(0,o.qtd)}
  const ncomb=combos.length,porC=Math.max(1,Math.round(por));
  ["escritor","conferente","plateia"].forEach(x=>equipe(x,"livre","Esperando a Planejadora terminar."));
  equipe("planejadora","trabalhando",`Estou lendo os posts que já venceram e escolhendo um molde para cada uma das ${ncomb} combinações. 0 de ${ncomb}.`);
  conta("Você","pediu "+o.qtd+" variações"+(o.assunto?` sobre "${o.assunto}"`:"")+".");
  try{
    let np=0;rr();
    if(o.assunto){
      equipe("planejadora","trabalhando",`Pesquisando na imprensa o que está acontecendo AGORA sobre "${o.assunto}" (fatos com data e fonte). Leva uns 50 segundos.`);
      try{const d=await chamar({acao:"pesquisar",lote,assunto:o.assunto,ambiente_id:amb});
        if(d.dossie){equipe("planejadora","trabalhando",`Pesquisa pronta: ${(d.dossie.fatos||[]).length} fatos com fonte. ${String(d.dossie.resumo_do_momento||"").slice(0,160)}`);conta("Planejadora",`pesquisou "${o.assunto}": ${String(d.dossie.resumo_do_momento||"").slice(0,200)}`)}}
      catch(e){equipe("planejadora","trabalhando",`A pesquisa falhou (${e.message}). Vou seguir sem afirmar fato nenhum sobre o assunto.`)}
    }
    // PAUTA DA SEMANA: a planejadora decide o conjunto inteiro (com o motivo de cada post); se falhar, volta ao jeito antigo
    let planos=null;
    if(o.qtd<=27){
      equipe("planejadora","trabalhando",`Montando a pauta da semana: ${o.qtd} posts, cada um com um trabalho (alcance, confiança ou venda) e o motivo de estar aqui.`);
      try{const r=await chamar({acao:"planejar_semana",lote,ambiente_id:amb,quantidade:o.qtd,assunto:o.assunto,dia:new Date().toISOString().slice(0,10)});
        planos=(r.planos||[]).map(v=>({ok:true,v}));
        const TR={alcance:"alcance",confianca:"confiança",venda:"venda"},AP={provado:"provado",variacao:"variação",experimento:"experimento"};
        conta("Planejadora","pauta da semana: "+(r.pauta_semana||[]).map(x=>`${ROT[x.tipo]||x.tipo} · ${TR[x.trabalho]||x.trabalho} · ${AP[x.aposta]||x.aposta}`).join(" | "));
        if((r.avisos||[]).length)conta("Planejadora","avisos da conferência da pauta: "+r.avisos.join("; "));
      }catch(e){equipe("planejadora","trabalhando",`A pauta da semana falhou (${e.message}). Vou pelo jeito antigo.`);planos=null}
    }
    if(!planos)planos=await emFila(combos,5,(c,i)=>chamar({acao:"planejar",lote,...c,ambiente_id:amb,giro:i,quantidade:porC,assunto:o.assunto,dia:new Date().toISOString().slice(0,10)}).then(r=>{np++;
      equipe("planejadora","trabalhando",`Já planejei ${np} de ${ncomb} combinações. Acabei de fazer ${ROT[c.tipo]} para ${ROT[c.persona_id]}.`);
      conta("Planejadora",`planejou ${ROT[c.tipo]} · ${ROT[c.persona_id]}: "${r.candidatos[0]?.gancho_capa||""}"`);rr();return r}));
    const ok=planos.filter(x=>x.ok).map(x=>x.v);
    if(!ok.length)throw new Error(planos[0].e.message);
    equipe("planejadora","pronto",`Terminei: ${ok.length} de ${ncomb} combinações planejadas.`+(ok.length<ncomb?` ${ncomb-ok.length} deram erro.`:""));
    equipe("conferente","livre","Esperando o Escritor terminar.");equipe("plateia","livre","Esperando o Escritor terminar.");
    const tarefas=ok.flatMap(pl=>pl.candidatos.map((_,i)=>({pauta_id:pl.pauta.id,indice:i,rot:`${ROT[pl.pauta.tipo]} · ${ROT[pl.pauta.persona_id]}`})));
    P.etapa=1;let ne=0;
    equipe("escritor","trabalhando",`Escrevendo ${tarefas.length} posts completos, de 8 a 12 slides cada. 0 prontos.`);rr();
    const escritas=await emFila(tarefas,6,t=>chamar({acao:"escrever",pauta_id:t.pauta_id,indice:t.indice}).then(r=>{ne++;
      equipe("escritor","trabalhando",`Já escrevi ${ne} de ${tarefas.length}. O último foi ${t.rot}.`);
      conta("Escritor",`terminou ${t.rot}: "${r.capa||""}"`);rr();return r}));
    const falhas=escritas.filter(x=>!x.ok);
    if(falhas.length===escritas.length)throw new Error(falhas[0].e.message);
    equipe("escritor","pronto",`Terminei de escrever ${escritas.length-falhas.length} posts.`+(falhas.length?` ${falhas.length} deram erro.`:""));
    P.etapa=2;let na=0;
    equipe("conferente","trabalhando","Lendo cada post atrás de conta errada, fato duvidoso e palavra que o público não usa.");
    equipe("plateia","trabalhando","Estamos rolando o feed e dando nota para cada capa.");rr();
    const av=await emFila(ok,5,pl=>chamar({acao:"avaliar",pauta_id:pl.pauta.id}).then(r=>{na++;
      equipe("conferente","trabalhando",`Já conferi ${na} de ${ok.length} combinações.`);
      conta("Conferente e plateia",`deram nota para ${ROT[pl.pauta.tipo]} · ${ROT[pl.pauta.persona_id]}.`);rr();return r}));
    const avf=av.filter(x=>!x.ok);
    P.n=av.filter(x=>x.ok).reduce((s,x)=>s+x.v.avaliadas,0);P.done=true;P.etapa=3;
    equipe("conferente","pronto",`Terminei. Apontei os problemas dentro de cada post, em "Por que esta proposta".`+(avf.length?` ${avf.length} deram erro.`:""));
    equipe("plateia","pronto","Demos nota para todas. Elas estão na aba Posts, da mais forte para a mais fraca.");
    conta("Fábrica",`${P.n} variações prontas para você ver.`);
    await carregar();toast(`${P.n} variações chegaram`);
  }catch(e){P.erro=e.message;conta("Fábrica","parou: "+e.message);
    for(const x of ["planejadora","escritor","conferente","plateia"])if(EQUIPE[x].estado==="trabalhando")equipe(x,"erro","Parei por um erro: "+e.message);
    toast("A fábrica parou: "+e.message)}
  rr();
}
function renderPipe(){
  const P=PIPE[acc];if(!P)return "";
  const pct=P.done?100:Math.round(100*P.etapa/ETAPAS.length);
  return `<section class="pipe" aria-label="Mecanismo dos agentes">
   <div class="pipehead"><b>${P.erro?`Parou: ${esc(P.erro)}`:P.done?`Pronto: ${P.n} variações abaixo, da mais forte para a mais fraca`:`A fábrica está gerando ${P.qtd} variações`}</b>${P.done||P.erro?'<button class="btn" data-pipehide>Esconder</button>':`<span class="small">${pct}%</span>`}</div>
   <div class="pbar"><i style="width:${pct}%"></i></div>
   <ol class="stages">${ETAPAS.map(([q,o],i)=>{const st=P.done||i<P.etapa?"ok":i===P.etapa&&!P.erro?"now":"wait";

document.addEventListener("input",e=>{const t=e.target;if(!t.classList||!t.classList.contains("pf"))return;const x=PROPS[acc].find(y=>y.id===+t.dataset.pid);if(!x)return;const k=t.dataset.k;
  if(k==="hist")x.hist=t.value.split("\n").filter(l=>l.trim());else if(k==="g"){const m=x.g.match(/<mark>(.*?)<\/mark>/);const v=t.value;x.g=m&&v.includes(m[1])?v.replace(m[1],`<mark>${m[1]}</mark>`):v}else x[k]=t.value});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.psel){const x=PROPS[acc].find(y=>y.id===+e.target.dataset.psel);x.sel=e.target.checked;render();return}
  if(e.target.id==="filepick"){[...e.target.files].forEach(f=>atts[pick].push({kind:f.type.startsWith("image/")?"imagem":f.type.startsWith("audio/")?"audio":"arquivo",name:f.name,file:f}));e.target.value="";render();return}
  if(modal&&e.target.id==="mtime"){modal.hora=e.target.value||modal.hora;drawCal()}
});
document.addEventListener("paste",e=>{const f=e.target.closest&&e.target.closest(".composer");if(!f)return;const files=[...(e.clipboardData?.files||[])];if(!files.length)return;e.preventDefault();files.forEach(x=>atts[f.dataset.where].push({kind:x.type.startsWith("image/")?"imagem":"arquivo",name:x.name||"foto colada",file:x}));render()});
let pick="chat";
document.addEventListener("submit",e=>{const f=e.target.closest(".composer");if(!f)return;e.preventDefault();const w=f.dataset.where;const ta=document.getElementById("ta-"+w);const v=ta.value.trim();
  if(!v&&!atts[w].length)return;
  ta.value="";enviarMensagem(w,v)});
document.addEventListener("keydown",e=>{
  if(viewer){if(e.key==="ArrowRight")vgo(1);if(e.key==="ArrowLeft")vgo(-1);if(e.key==="Escape"){viewer=null;render()}return}
  if(e.key==="Escape"){document.querySelector(".ctx")?.remove();if(modal){modal=null;render()}else if(drawer){drawer=false;render()}}
  if(e.key==="Enter"&&!e.shiftKey&&e.target.tagName==="TEXTAREA"){e.preventDefault();e.target.closest("form").requestSubmit()}});
async function entrar(){
  const {data:{session}}=await sb.auth.getSession();const L=document.getElementById("login");
  if(!session){L.hidden=false;return}
  L.hidden=true;document.getElementById("quem").textContent=session.user.email;await carregarAmbientes();await carregar();carregarChat();
}
document.getElementById("lform").addEventListener("submit",async e=>{e.preventDefault();e.stopPropagation();const m=document.getElementById("l-msg");m.textContent="Entrando…";
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById("l-email").value.trim(),password:document.getElementById("l-pass").value});
  if(error){m.textContent=/confirm/i.test(error.message)?"Falta confirmar o acesso pelo link que chegou no seu e-mail.":"Não entrou: "+error.message;return}
  entrar()});
document.addEventListener("change",e=>{const sel=e.target.closest("[data-damolde]");if(!sel)return;const p=POSTS.find(x=>x.id===aberto);if(!p)return;planejarVisual(p,{forcar:{[sel.dataset.damolde]:sel.value}})});
document.getElementById("l-criar").addEventListener("click",async()=>{const m=document.getElementById("l-msg");const email=document.getElementById("l-email").value.trim(),password=document.getElementById("l-pass").value;
  if(!email||password.length<8){m.textContent="Escreva o e-mail e uma senha de pelo menos 8 caracteres.";return}
  m.textContent="Criando…";const {data,error}=await sb.auth.signUp({email,password});
  if(error){m.textContent="Não criou: "+error.message;return}
  if(data.session){entrar();return}
  m.textContent="Pronto. Abra o e-mail de confirmação e clique no link (se ele abrir uma página que não carrega, tudo bem: o acesso já fica confirmado). Depois volte aqui e clique em Entrar."});
render();entrar();
</script>
