<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento da marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonte-base" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800&display=swap">
<style>
:root{
  /* roupa da marca (o documento.js troca pelos valores da ficha G6) */
  --bg:#F7F5F0; --ink:#1B1B1F; --muted:#5E5E66; --line:#DCD8CF; --sup:#EFEBE3;
  --acc:#0F766E; --acc-ink:#0F766E; --dark:#16181D; --on-dark:#F7F5F0; --acc-on-dark:#5EEAD4;
  --f-tit:"Inter Tight",system-ui,sans-serif; --f-txt:"Inter",system-ui,sans-serif;
  /* selos (fixos em toda marca) */
  --s-verde:#1F9D55; --s-amarelo:#D99A00; --s-cinza:#9AA0A6;
  /* moldura da tela (não é da marca) */
  --mesa:#E4E1DA; --ui:#FFFFFF; --ui-ink:#1D1D21; --ui-muted:#6B6B73; --ui-line:#D9D6CF; --ui-acc:#2B4EFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --mesa:#1E1F22; --ui:#2A2B2F; --ui-ink:#ECECEE; --ui-muted:#A3A3AB; --ui-line:#3A3B40; --ui-acc:#7D93FF; }
}
:root[data-theme="dark"]{ --mesa:#1E1F22; --ui:#2A2B2F; --ui-ink:#ECECEE; --ui-muted:#A3A3AB; --ui-line:#3A3B40; --ui-acc:#7D93FF; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--mesa);color:var(--ui-ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- moldura da tela ---------- */
#faixa{position:relative;z-index:60;background:#FFE27A;color:#3A2E00;text-align:center;font:600 13px/1.3 "Inter",sans-serif;padding:7px 16px}
.topo-fixo{position:sticky;top:0;z-index:60}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--ui);border-bottom:1px solid var(--ui-line)}
.barra .nome{font-weight:700;font-size:15px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .nome small{font-weight:500;color:var(--ui-muted);margin-left:6px}
.bt{border:1px solid var(--ui-line);background:var(--ui);color:var(--ui-ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.bt:hover{border-color:var(--ui-ink)}
.bt.forte{background:var(--ui-ink);color:var(--ui);border-color:var(--ui-ink)}
.bt.pequeno{padding:4px 10px;font-size:12px}
.bt:disabled{opacity:.45;cursor:default}
#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ui-ink);color:var(--ui);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.estado{max-width:640px;margin:48px auto;padding:24px;background:var(--ui);border-radius:14px;border:1px solid var(--ui-line);line-height:1.5}
.estado h1{font-size:20px;margin:0 0 8px}
.estado a{color:var(--ui-acc)}

#doc{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 16px 140px;transition:margin .2s}
body.chat-aberto #doc{margin-right:400px}
@media (max-width:1100px){ body.chat-aberto #doc{margin-right:0} }

/* ---------- página (paisagem) ---------- */
.pg{position:relative;width:min(1120px,100%);aspect-ratio:297/210;container-type:inline-size;background:var(--bg);color:var(--ink);font-family:var(--f-txt);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.10);display:flex;flex-direction:column;padding:4.6cqw 5.4cqw 3.2cqw;overflow-x:clip;
  --t:max(13px,1.42cqw); font-size:var(--t); line-height:1.45}
.pg.escura{background:var(--dark);color:var(--on-dark)}
.pg.foco{outline:3px solid var(--ui-acc);outline-offset:4px}
.pg-topo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:600 max(10px,.95cqw)/1 var(--f-txt);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:2.6cqw}
.pg.escura .pg-topo{color:color-mix(in srgb,var(--on-dark) 60%,transparent)}
.pg-corpo{flex:1;display:flex;flex-direction:column;min-height:0}
.pg-rodape{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-top:2.4cqw;padding-top:1.2cqw;border-top:1px solid var(--line);font-size:max(10px,.86cqw);color:var(--muted)}
.pg.escura .pg-rodape{border-color:color-mix(in srgb,var(--on-dark) 20%,transparent);color:color-mix(in srgb,var(--on-dark) 60%,transparent)}
.pg-rodape b{font-weight:600;color:inherit}
.pg-rodape .num{font:700 max(11px,1.1cqw)/1 var(--f-tit);color:var(--ink)}
.pg.escura .pg-rodape .num{color:var(--on-dark)}
.pg-acoes{position:absolute;top:1.4cqw;right:1.6cqw;display:flex;gap:6px;z-index:3}
.pg-acoes .bt{background:var(--ui);color:var(--ui-ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pg-acoes .bt.sim{background:var(--s-verde);color:#fff;border-color:var(--s-verde)}
.pg-acoes .bt.nao{background:#B3261E;color:#fff;border-color:#B3261E}
.nota-cliente{position:absolute;top:4.2cqw;right:1.6cqw;width:min(340px,70%);background:var(--ui);color:var(--ui-ink);border:1px solid var(--ui-line);border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:4;font-family:"Inter",sans-serif;font-size:13px}
.nota-cliente textarea{width:100%;min-height:70px;margin:6px 0;font:inherit;border:1px solid var(--ui-line);border-radius:8px;padding:8px;background:var(--ui);color:var(--ui-ink)}

/* tipografia da página */
.titulo{font:700 max(22px,3.9cqw)/1.06 var(--f-tit);letter-spacing:-.02em;margin:0 0 1.6cqw;max-width:30ch;text-wrap:balance}
.titulo.g{font-size:max(28px,5.6cqw);max-width:18ch}
.titulo em{font-style:normal;color:var(--acc-ink)}
.pg.escura .titulo em{color:var(--acc-on-dark)}
.lead{font-size:max(14px,1.62cqw);color:var(--muted);max-width:62ch;margin:0 0 2cqw}
.pg.escura .lead{color:color-mix(in srgb,var(--on-dark) 75%,transparent)}
.rot{font:700 max(10px,.9cqw)/1.2 var(--f-txt);letter-spacing:.16em;text-transform:uppercase;color:var(--acc-ink);margin:0 0 .6cqw;display:flex;align-items:center;gap:.6em}
.pg.escura .rot{color:var(--acc-on-dark)}
.falta{color:var(--s-cinza);font-style:italic}
p{margin:0 0 .8em}
ul.lim{margin:0;padding:0;list-style:none}
ul.lim li{padding:.35em 0;border-bottom:1px solid var(--line)}
ul.lim li:last-child{border-bottom:0}

/* selo */
.selo{display:inline-block;width:.72em;height:.72em;border-radius:50%;flex:none;vertical-align:middle;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 0%,var(--bg))}
.s-verde{background:var(--s-verde)} .s-amarelo{background:var(--s-amarelo)} .s-cinza{background:var(--s-cinza)}
.selo-txt{display:inline-flex;align-items:center;gap:.45em;font-size:max(10px,.86cqw);font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none}

/* grades */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8cqw}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.col-l{display:grid;grid-template-columns:1.1fr 1fr;gap:3.2cqw;align-items:start;flex:1}
.cartao{background:var(--sup);border-radius:1cqw;padding:1.6cqw 1.8cqw}
.pg.escura .cartao{background:color-mix(in srgb,var(--on-dark) 8%,transparent)}
.cartao h4{font:700 max(14px,1.55cqw)/1.15 var(--f-tit);margin:0 0 .5cqw}
.cartao .mini{font-size:max(11px,1.1cqw);color:var(--muted)}

/* número grande com fonte */
.num-g{font:800 max(54px,11.5cqw)/.9 var(--f-tit);letter-spacing:-.04em;color:var(--acc-ink)}
.pg.escura .num-g{color:var(--acc-on-dark)}
.num-m{font:800 max(32px,5.4cqw)/.95 var(--f-tit);letter-spacing:-.03em;color:var(--acc-ink)}
.pg.escura .num-m{color:var(--acc-on-dark)}
.num-fonte{font-size:max(10px,.9cqw);color:var(--muted);margin-top:.8cqw;display:flex;gap:.5em;align-items:center}
.pg.escura .num-fonte{color:color-mix(in srgb,var(--on-dark) 60%,transparent)}
.num-txt{font-size:max(14px,1.6cqw);max-width:26ch;margin-top:.8cqw}

/* caixas: teste de troca, sendo sincero, antes/depois */
.caixa{border:2px solid var(--ink);border-radius:1cqw;padding:1.4cqw 1.8cqw;margin-top:1.6cqw}
.pg.escura .caixa{border-color:var(--on-dark)}
.caixa .rot{color:var(--ink)}
.pg.escura .caixa .rot{color:var(--on-dark)}
.caixa.sincero{border:0;background:var(--dark);color:var(--on-dark)}
.caixa.sincero .rot{color:var(--acc-on-dark)}
.antes-depois{display:grid;grid-template-columns:1fr auto 1fr;gap:1.6cqw;align-items:stretch}
.antes-depois .seta{align-self:center;font:700 max(20px,2.4cqw)/1 var(--f-tit);color:var(--acc-ink)}
.antes-depois .ad{border-radius:1cqw;padding:1.4cqw 1.6cqw;background:var(--sup)}
.antes-depois .ad.depois{background:var(--dark);color:var(--on-dark)}
.antes-depois .ad.depois .rot{color:var(--acc-on-dark)}
.antes-depois .ad b{display:block;font:700 max(15px,1.8cqw)/1.2 var(--f-tit)}

/* capa e capa de parte */
.capa-marca{font:800 max(44px,9.5cqw)/.9 var(--f-tit);letter-spacing:-.04em;margin:auto 0 1.4cqw;color:var(--acc-on-dark)}
.capa-sub{font:600 max(15px,2cqw)/1.2 var(--f-tit);color:var(--on-dark);margin-bottom:.6cqw}
.capa-meta{font-size:max(12px,1.1cqw);color:color-mix(in srgb,var(--on-dark) 65%,transparent)}
.parte-n{font:800 max(80px,24cqw)/.8 var(--f-tit);letter-spacing:-.05em;color:var(--acc-on-dark);position:absolute;right:4cqw;bottom:2cqw;opacity:.95}
.parte-rot{font:700 max(11px,1cqw)/1 var(--f-txt);letter-spacing:.24em;text-transform:uppercase;color:var(--acc-on-dark);margin-top:auto}
.parte-tit{font:800 max(36px,7.4cqw)/.95 var(--f-tit);letter-spacing:-.035em;margin:.8cqw 0 1.2cqw;max-width:9ch}
.parte-lead{font-size:max(14px,1.6cqw);max-width:40ch;color:color-mix(in srgb,var(--on-dark) 75%,transparent);margin-bottom:2cqw}
.legenda-selos{display:flex;gap:2.4cqw;flex-wrap:wrap;margin-top:2cqw}
.legenda-selos span{display:inline-flex;gap:.6em;align-items:center;font-size:max(12px,1.15cqw)}

/* concorrente */
.conc{background:var(--sup);border-radius:1cqw;padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:.5cqw}
.conc h4{font:700 max(15px,1.7cqw)/1.1 var(--f-tit);margin:0}
.conc .oque{font-size:max(12px,1.15cqw);color:var(--muted);flex:1}
.brecha{margin-top:.6cqw;border-top:2px solid var(--ink);padding-top:.6cqw}
.brecha .rot{color:var(--ink);margin-bottom:.2cqw}
.brecha p{font-weight:600;margin:0;font-size:max(12px,1.2cqw)}
.eixos{position:relative;aspect-ratio:1.5/1;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:1cqw 0 2.6cqw 1.6cqw}
.eixos .ex{position:absolute;font-size:max(10px,.95cqw);color:var(--muted)}
.eixos .ponto{position:absolute;transform:translate(-50%,-50%);background:var(--sup);border-radius:999px;padding:.3em .7em;font-size:max(10px,1cqw);font-weight:600;white-space:nowrap}
.eixos .ponto.nos{background:var(--dark);color:var(--acc-on-dark)}

/* em vez de / fala assim */
.evd{width:100%;border-collapse:collapse}
.evd th{text-align:left;font:700 max(10px,.92cqw)/1 var(--f-txt);letter-spacing:.16em;text-transform:uppercase;padding:0 1cqw .8cqw 0;color:var(--muted)}
.evd th:last-child{color:var(--acc-ink)}
.evd td{padding:.7cqw 1.4cqw .7cqw 0;border-top:1px solid var(--line);vertical-align:top}
.evd td:first-child{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.evd td:last-child{font-weight:600}
.evd.compacto td{padding:.5cqw 1.2cqw .5cqw 0;font-size:max(12px,1.32cqw)}
.soa{display:flex;flex-wrap:wrap;gap:.5cqw;margin-top:.4cqw}
.soa span{border:1.5px solid var(--ink);border-radius:999px;padding:.25em .8em;font-weight:600;font-size:max(12px,1.15cqw)}
.soa.nunca span{border-color:var(--s-cinza);color:var(--muted);text-decoration:line-through}
.regua{margin:.9cqw 0}
.regua .linha{position:relative;height:.5cqw;min-height:4px;background:var(--line);border-radius:9px;margin:.5cqw 0}
.regua .linha i{position:absolute;top:50%;width:1.6cqw;height:1.6cqw;min-width:12px;min-height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--ink);transform:translate(-50%,-50%)}
.regua .pontas{display:flex;justify-content:space-between;font-size:max(11px,1.05cqw);color:var(--muted)}

/* persona */
.persona-cab{display:flex;gap:2cqw;align-items:center;margin-bottom:1.6cqw}
.avatar{width:7cqw;height:7cqw;min-width:54px;min-height:54px;border-radius:50%;background:var(--dark);color:var(--acc-on-dark);display:grid;place-items:center;font:800 max(20px,3cqw)/1 var(--f-tit)}
.campo-p{border-top:2px solid var(--ink);padding-top:.8cqw}
.campo-p .rot{color:var(--ink)}

/* celular */
.celulares{display:flex;gap:2.4cqw;justify-content:center;align-items:flex-start}
.cel{width:min(23cqw,260px);min-width:170px;background:#0B0B0C;border-radius:3cqw;padding:.8cqw;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:"Inter",system-ui,sans-serif;color:#111}
.cel .tela{background:#fff;border-radius:2.3cqw;overflow:hidden;position:relative}
.cel .ilha{position:absolute;top:.6cqw;left:50%;transform:translateX(-50%);width:28%;height:1.5cqw;min-height:10px;background:#0B0B0C;border-radius:99px;z-index:2}
.cel .ig-top{display:flex;align-items:center;gap:6px;padding:2.6cqw .9cqw .6cqw;font-size:max(9px,.85cqw);font-weight:700}
.cel .ig-top .av{width:1.9cqw;height:1.9cqw;min-width:16px;min-height:16px;border-radius:50%;background:var(--acc);border:1.5px solid #fff;box-shadow:0 0 0 1.5px #d62976}
.cel .midia{position:relative;aspect-ratio:4/5;overflow:hidden;display:flex;flex-direction:column}
.cel .midia.vert{aspect-ratio:9/16}
.cel .ig-acoes{display:flex;gap:8px;padding:.6cqw .9cqw .2cqw;font-size:max(11px,1.1cqw)}
.cel .ig-leg{padding:.2cqw .9cqw .9cqw;font-size:max(8.5px,.8cqw);line-height:1.35;color:#222}
.cel .ig-leg b{font-weight:700}
.post{flex:1;display:flex;flex-direction:column;padding:1.4cqw;gap:.6cqw}
.post .p-tit{font:800 max(14px,1.9cqw)/1.05 var(--f-tit);letter-spacing:-.02em}
.post .p-tx{font-size:max(9px,.9cqw);line-height:1.35}
.post .p-handle{font-size:max(8px,.72cqw);opacity:.7;margin-top:auto}
.post .foto{flex:1;border-radius:.6cqw;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink) 9%,transparent) 0 6px,transparent 6px 12px),var(--sup);display:grid;place-items:center;text-align:center;font-size:max(8px,.75cqw);color:var(--muted);padding:.6cqw;min-height:40px}
.post .chip{align-self:flex-start;font:700 max(7px,.7cqw)/1 var(--f-txt);letter-spacing:.14em;text-transform:uppercase;padding:.35em .7em;border-radius:99px;background:var(--acc);color:var(--ink)}
.post .opc{border:1.5px solid currentColor;border-radius:99px;padding:.45em .8em;font-weight:700;font-size:max(9px,.95cqw);text-align:center}
.quadros{display:flex;flex-direction:column;gap:.5cqw;min-width:0;flex:1;max-width:44cqw}
.quadro{display:grid;grid-template-columns:auto 1fr;gap:1cqw;background:var(--sup);border-radius:.8cqw;padding:.8cqw 1cqw;font-size:max(11px,1.05cqw)}
.quadro b{font:800 max(13px,1.4cqw)/1 var(--f-tit);color:var(--acc-ink)}
.quadro .q-tela{font-weight:700}
.tipo-info{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;margin:0 0 1.6cqw}
.tipo-info div{border-top:2px solid var(--ink);padding-top:.5cqw;font-size:max(11px,1.1cqw)}
.tipo-info .rot{color:var(--muted);margin-bottom:.2cqw}
.tipo-corpo{display:grid;grid-template-columns:1fr auto;gap:2.6cqw;flex:1;align-items:start}

/* roda de pilares */
.roda-wrap{display:grid;grid-template-columns:auto 1fr;gap:3.6cqw;align-items:center;flex:1}
.roda{width:min(30cqw,320px);min-width:180px;aspect-ratio:1}
.roda text{font-family:var(--f-tit)}
.barras .b{display:grid;grid-template-columns:9em 1fr 3em;gap:1cqw;align-items:center;margin:.55cqw 0;font-size:max(12px,1.15cqw)}
.barras .trilho{height:1.3cqw;min-height:10px;background:var(--sup);border-radius:99px;overflow:hidden}
.barras .trilho i{display:block;height:100%;background:var(--ink);border-radius:99px}
.barras .b:first-child .trilho i{background:var(--acc)}
.leg-pil{display:flex;flex-wrap:wrap;gap:.6cqw 1.6cqw;margin-top:1cqw;font-size:max(12px,1.1cqw)}
.leg-pil span{display:inline-flex;gap:.5em;align-items:center}
.leg-pil i{width:.9em;height:.9em;border-radius:3px;display:inline-block}

/* calendário */
.linha-tempo{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1cqw;margin:2.4cqw 0 2cqw;padding-top:2.2cqw}
.linha-tempo:before{content:"";position:absolute;top:.75cqw;left:0;right:0;height:3px;background:var(--ink)}
.marco{position:relative;font-size:max(11px,1.1cqw)}
.marco:before{content:"";position:absolute;top:-1.95cqw;left:0;width:1.5cqw;height:1.5cqw;min-width:11px;min-height:11px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.marco.forte:before{background:var(--acc)}
.marco b{display:block;font:800 max(14px,1.6cqw)/1.1 var(--f-tit)}
.marco .regra{display:inline-block;margin-top:.3cqw;font-size:max(9px,.82cqw);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.15em .5em;border-radius:4px}
.r-participa{background:color-mix(in srgb,var(--s-verde) 18%,transparent);color:#145C33}
.r-so_informa{background:color-mix(in srgb,var(--s-amarelo) 22%,transparent);color:#6B4B00}
.r-nunca{background:color-mix(in srgb,#B3261E 15%,transparent);color:#8C1D18}

/* semáforo */
.semaforo{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;flex:1}
.sem{border-radius:1cqw;padding:1.4cqw 1.6cqw;background:var(--sup);border-top:1cqw solid}
.sem.v{border-color:var(--s-verde)} .sem.a{border-color:var(--s-amarelo)} .sem.r{border-color:#B3261E}
.sem h4{font:800 max(16px,1.9cqw)/1.1 var(--f-tit);margin:0 0 .6cqw}

/* paleta e fontes */
.paleta{display:flex;gap:.8cqw;flex-wrap:wrap}
.cor{flex:1;min-width:70px}
.cor .am{aspect-ratio:1.2;border-radius:.8cqw;border:1px solid var(--line)}
.cor .nm{font-size:max(10px,.95cqw);font-weight:600;margin-top:.4cqw}
.cor .hx{font-size:max(9px,.85cqw);color:var(--muted);font-family:ui-monospace,monospace}
.especime{font:700 max(40px,6cqw)/1 var(--f-tit)}
.especime.t{font-family:var(--f-txt);font-weight:500}

/* aprovação */
.aprov-lista{display:grid;grid-template-columns:1fr 1fr;gap:.2cqw 3cqw;flex:1;align-content:start}
.aprov-item{display:flex;align-items:center;gap:1cqw;padding:.7cqw 0;border-bottom:1px solid var(--line);font-size:max(12px,1.2cqw)}
.aprov-item .n{font:800 max(12px,1.2cqw)/1 var(--f-tit);color:var(--acc-ink);width:2.4em}
.aprov-item .resp{margin-left:auto;font-size:max(10px,.95cqw);font-weight:700}
.aprov-item .resp.ok{color:var(--s-verde)} .aprov-item .resp.mud{color:#B3261E}
.assinatura{margin-top:2cqw;display:flex;gap:3cqw;align-items:flex-end}
.assinatura .linha{flex:1;border-bottom:2px solid var(--ink);padding-bottom:.4cqw;font:700 max(16px,1.8cqw)/1.2 var(--f-tit);min-height:2.6cqw}

/* apêndice */
.ap-tab{width:100%;border-collapse:collapse;font-size:max(10.5px,.98cqw)}
.titulo.ap{font-size:max(18px,2.6cqw);max-width:none}
.ap-tab td{padding:.4cqw .8cqw .4cqw 0;border-top:1px solid var(--line);vertical-align:top}
.ap-tab td:first-child{white-space:nowrap;width:1%;color:var(--muted)}
.ap-tab td:last-child{width:22%;color:var(--muted);font-size:.92em}
.ap-col{columns:2;column-gap:3cqw}
.ap-col > div{break-inside:avoid;margin-bottom:1.4cqw}

/* rodapé geral */
.rodape-geral{font-size:12px;color:var(--ui-muted);text-align:center;padding:4px 16px 24px}

/* ---------- painel de chat ---------- */
#chat{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--ui);color:var(--ui-ink);border-left:1px solid var(--ui-line);z-index:70;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
#chat header{padding:14px 16px;border-bottom:1px solid var(--ui-line);display:flex;gap:8px;align-items:flex-start}
#chat header h2{font-size:15px;margin:0;line-height:1.3}
#chat header small{display:block;color:var(--ui-muted);font-weight:500;font-size:12px;margin-top:2px}
#chat .corpo{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.45}
#chat label{font-size:12px;font-weight:700;color:var(--ui-muted);display:block;margin-bottom:4px}
#chat select,#chat textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--ui-line);border-radius:8px;padding:8px;background:var(--ui);color:var(--ui-ink)}
#chat textarea{min-height:80px;resize:vertical}
#chat .valor{background:color-mix(in srgb,var(--ui-ink) 5%,transparent);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:13px;max-height:180px;overflow:auto}
.msg{border-radius:12px;padding:10px 12px;max-width:92%}
.msg.eu{align-self:flex-end;background:var(--ui-ink);color:var(--ui)}
.msg.ag{align-self:flex-start;background:color-mix(in srgb,var(--ui-ink) 7%,transparent)}
.ad-chat{display:grid;gap:8px;margin-top:8px}
.ad-chat div{border-radius:8px;padding:8px;font-size:13px;white-space:pre-wrap;max-height:160px;overflow:auto}
.ad-chat .a{background:color-mix(in srgb,#B3261E 10%,transparent);text-decoration:line-through;text-decoration-color:color-mix(in srgb,#B3261E 45%,transparent)}
.ad-chat .d{background:color-mix(in srgb,var(--s-verde) 14%,transparent)}
.ad-chat b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;text-decoration:none}
#chat footer{padding:12px 16px;border-top:1px solid var(--ui-line);display:flex;flex-wrap:wrap;gap:8px}
.custo{font-size:12px;color:var(--ui-muted)}

/* barra do cliente */
#barra-cliente{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ui);border-top:1px solid var(--ui-line);padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;box-shadow:0 -8px 30px rgba(0,0,0,.08)}
#barra-cliente input,#barra-cliente textarea{font:inherit;font-size:14px;border:1px solid var(--ui-line);border-radius:8px;padding:8px 10px;background:var(--ui);color:var(--ui-ink)}
#barra-cliente input{width:220px}
#barra-cliente textarea{width:min(420px,100%);height:40px;resize:vertical}
#barra-cliente .st{font-size:13px;color:var(--ui-muted)}

/* ---------- celular (tela estreita) ---------- */
@media (max-width:760px){
  .pg{aspect-ratio:auto;padding:22px 18px 16px;border-radius:4px}
  .g2,.g3,.g4,.col-l,.roda-wrap,.tipo-corpo,.semaforo,.aprov-lista,.antes-depois{grid-template-columns:1fr}
  .antes-depois .seta{transform:rotate(90deg);justify-self:center}
  .tipo-info{grid-template-columns:1fr 1fr}
  .celulares{flex-wrap:wrap}
  .linha-tempo{grid-auto-flow:row;padding-top:0;padding-left:22px}
  .linha-tempo:before{top:0;bottom:0;left:6px;right:auto;width:3px;height:auto}
  .marco:before{top:3px;left:-22px}
  .parte-n{position:static;margin-top:16px}
  .ap-col{columns:1}
  .pg-acoes{position:static;justify-content:flex-end;margin:-8px 0 8px}
  .nota-cliente{position:static;width:100%;margin-bottom:8px}
  .barra .nome{flex-basis:100%}
  #barra-cliente input{width:100%}
  #barra-cliente{gap:6px;padding:8px 12px}
  #barra-cliente textarea{height:36px}
}

/* medida de impressão (o documento.js liga por um instante para calcular o encaixe de cada página) */
body.medir .pg{width:297mm!important;height:210mm!important;aspect-ratio:auto!important;padding:4.6cqw 5.4cqw 3.2cqw!important}
body.medir .pg-corpo{overflow:hidden}

/* ---------- impressão (PDF) ---------- */
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff}
  .topo-fixo,#faixa,.barra,#chat,#barra-cliente,.pg-acoes,.nota-cliente,#aviso,.rodape-geral .so-tela{display:none!important}
  #doc{display:block;padding:0;margin:0!important}
  .rodape-geral{display:none}
  .pg{width:297mm;height:210mm;aspect-ratio:auto;border-radius:0;box-shadow:none;break-after:page;break-inside:avoid;overflow:hidden;outline:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg:last-child{break-after:auto}
  .pg-corpo{zoom:var(--z,1)}
  .pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="topo-fixo">
<div id="faixa" hidden>Modo demonstração · Marca Exemplo (fictícia) · nada é salvo</div>
<div class="barra" id="barra">
  <div class="nome" id="b-nome">Documento da marca</div>
  <button class="bt" id="b-ficha" hidden title="Abre uma ficha .json do seu computador só nesta tela; nada é enviado">Abrir ficha do computador</button>
  <input type="file" id="in-ficha" accept=".json,application/json" hidden>
  <button class="bt" id="b-link" hidden>Copiar link do cliente</button>
  <button class="bt" id="b-pdf">Imprimir / PDF</button>
</div>
</div>
<main id="doc" aria-live="polite"><div class="estado">Carregando o documento…</div></main>
<div class="rodape-geral" id="rodape-geral" hidden>Feito pela Smoking Duck · <span class="so-tela">verde = confirmado · amarelo = proposta com fonte · cinza = falta</span></div>

<aside id="chat" hidden aria-label="Corrigir trecho">
  <header>
    <div style="flex:1;min-width:0"><h2 id="c-tit">Corrigir</h2><small id="c-sub"></small></div>
    <button class="bt pequeno" id="c-fechar">Fechar</button>
  </header>
  <div class="corpo" id="c-corpo"></div>
  <footer id="c-pe"></footer>
</aside>

<div id="barra-cliente" hidden>
  <span class="st" id="cl-st">Marque cada parte com "É a nossa cara" ou "Quero mudar".</span>
  <input id="cl-nome" placeholder="Seu nome" maxlength="80" autocomplete="name">
  <textarea id="cl-texto" placeholder="O que vocês querem mudar? (só para pedir mudança)" maxlength="4000"></textarea>
  <button class="bt" id="cl-mudar">Pedir mudança</button>
  <button class="bt forte" id="cl-aprovar">Aprovo a v1</button>
</div>
<div id="aviso" hidden></div>

<script src="js/documento.js"></script>
</body>
</html>
