name: Montar carrosséis

# A cada 5 minutos o robô olha se há post esperando montagem (clicado em "Montar" na fábrica).
# Se houver: diagrama com IA, gera a foto da capa, desenha os slides e devolve ao Supabase.
# Identidade: token OIDC do próprio GitHub (nenhum segredo guardado aqui).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: montador
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tem post na fila?
        id: fila
        run: python montagem/robo.py --contar
      - name: Instalar o desenhador (Chromium)
        if: steps.fila.outputs.pendentes != '0'
        run: |
          pip install -q playwright==1.63.0 pillow opencv-python-headless==4.10.0.84
          python -m playwright install --with-deps chromium
      - name: Montar
        if: steps.fila.outputs.pendentes != '0'
        env:
          MONTADOR_LIMITE: "4"
        run: python montagem/robo.py
