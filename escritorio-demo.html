<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório · demonstração</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0a0b0d;color:#eee;font-family:Inter,sans-serif}.box{max-width:820px;height:640px;margin:20px auto;padding:0 16px}</style>
</head><body><div class="box" id="box"></div>
<script src="escritorio.js"></script>
<script>
const e = Escritorio.criar(document.getElementById("box"));
const roteiro = [
 ["diagramador","trabalhando","Peguei o texto aprovado. Vou dividir em slides e escolher o molde de cada um."],
 ["diagramador","pronto","Pronto: 11 slides. Conferi palavra por palavra: nenhuma mudou."],
 ["diretor","trabalhando","Lendo a capa para decidir o instante exato da foto e o que tem que aparecer nela."],
 ["diretor","pronto","Cena: ele acabou de ver 'Transação negada' na mesa da sala. Tem que aparecer: extrato, boletos, convite, foto do casal."],
 ["fotografo","trabalhando","Fotografando a cena (foto realista de celular, expressão contida, sem faixa preta)."],
 ["fotografo","pronto","Foto pronta em 24s. Mandei para o Conferente."],
 ["conferente","trabalhando","Olhando a foto: os detalhes do texto estão lá? A expressão bate com o momento?"],
 ["conferente","trabalhando","Nota 6/10. Falta: o extrato bancário. Expressão: boca aberta demais, parece susto de novela."],
 ["retocador","trabalhando","Corrigindo só o que o Conferente apontou: rosto quase neutro e extrato visível na mesa."],
 ["retocador","pronto","Corrigido. Devolvi para o Conferente olhar de novo."],
 ["conferente","trabalhando","Olhando a foto de novo…"],
 ["conferente","pronto","Nota 8/10. Falta: nada. Expressão: ok."],
 ["montador","trabalhando","Desenhando os 11 slides em 1080×1350 com os moldes dos vencedores."],
 ["montador","pronto","11 slides desenhados. Conferi se nenhum texto ficou cortado."],
 ["entregador","trabalhando","Guardando os slides no banco e mandando para a sua tela."],
 ["entregador","pronto","Entregue! 11 slides prontos no post em 212s."],
].map(([agente,estado,fala],i)=>({agente,estado,fala,criado_em:new Date(Date.now()-((16-i)*12000)).toISOString()}));
e.carregar(roteiro, false);
setTimeout(()=>document.querySelector('[data-escr="rever"]').click(), 600);
</script></body></html>
